<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#38bdf8;#60a5fa" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#818cf8;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#60a5fa;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing accent gradients -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#titleGrad); letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Dynamic Glowing Atmospheric Orbs (Background) -->
  <circle cx="220" cy="120" r="240" fill="url(#orbGlow1)">
    <animate attributeName="cx" values="220;260;200;220" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="120;160;100;120" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="300" r="260" fill="url(#orbGlow2)">
    <animate attributeName="cx" values="980;940;1010;980" dur="16s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300;260;320;300" dur="13s" repeatCount="indefinite" />
  </circle>

  <!-- Background Dynamic Network Connections / Floating Lines -->
  <g opacity="0.35">
    <path d="M 50 360 Q 300 280 600 360 T 1150 320" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="20s" repeatCount="indefinite" />
    </path>
    <path d="M 80 80 Q 400 180 800 80 T 1120 140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="25s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Dynamic Particle Nodes in Background -->
  <circle cx="150" cy="280" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="280;270;280" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="110" r="3.5" fill="#a855f7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="110;120;110" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="370" r="2.5" fill="#34d399">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT: Header Branding & Titles (Guaranteed Crisp & Clear) -->
  <g transform="translate(600, 110)">
    <!-- Main Title with Gradient -->
    <text class="title-text" text-anchor="middle" y="0">Awesome Conversational AI &amp; Team Chat</text>
    
    <!-- Subtitle -->
    <text class="subtitle-text" text-anchor="middle" y="44">Enterprise Team Workspaces • Self-Hosted Slack/Discord Clones • Federated Matrix &amp; ChatOps</text>
    
    <!-- Tagline -->
    <text class="tagline-text" text-anchor="middle" y="78">Curated SaaS Platforms, Decentralized Protocols, AI Copilots &amp; Open-Source Repositories</text>
  </g>

  <!-- Dynamic Feature Badges / Interactive Pills Row (Foreground, Y: 230) -->
  <g transform="translate(130, 220)">
    <!-- Pill 1: Conversational AI -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#38bdf8">
        <animate attributeName="fill" values="#38bdf8;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite" />
      </circle>
      <text class="pill-text" x="38" y="24">🤖 Conversational AI</text>
    </g>

    <!-- Pill 2: Open Source & Self-Hosted -->
    <g transform="translate(195, 0)">
      <rect width="195" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#34d399">
        <animate attributeName="fill" values="#34d399;#10b981;#34d399" dur="4s" repeatCount="indefinite" />
      </circle>
      <text class="pill-text" x="38" y="24">🚀 Self-Hosted Chat</text>
    </g>

    <!-- Pill 3: Federated Matrix / E2EE -->
    <g transform="translate(405, 0)">
      <rect width="185" height="38" rx="19" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#c084fc">
        <animate attributeName="fill" values="#c084fc;#a855f7;#c084fc" dur="4s" repeatCount="indefinite" />
      </circle>
      <text class="pill-text" x="38" y="24">🔒 Matrix &amp; E2EE</text>
    </g>

    <!-- Pill 4: DevOps & ChatOps -->
    <g transform="translate(605, 0)">
      <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#fbbf24">
        <animate attributeName="fill" values="#fbbf24;#f59e0b;#fbbf24" dur="4s" repeatCount="indefinite" />
      </circle>
      <text class="pill-text" x="38" y="24">⚡ DevOps &amp; Bots</text>
    </g>

    <!-- Pill 5: Cloud Enterprise SaaS -->
    <g transform="translate(785, 0)">
      <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#22d3ee">
        <animate attributeName="fill" values="#22d3ee;#06b6d4;#22d3ee" dur="4s" repeatCount="indefinite" />
      </circle>
      <text class="pill-text" x="38" y="24">☁️ Enterprise SaaS</text>
    </g>
  </g>

  <!-- Visual Highlights Showcase Row (Cards / Category Nodes Y: 290) -->
  <g transform="translate(100, 290)">
    <!-- Card 1: Enterprise Hubs -->
    <g transform="translate(0, 0)">
      <rect width="230" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text class="node-title" x="20" y="32">🏢 Enterprise SaaS Leaders</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" x="20" y="54">Slack • Teams • Google Chat</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="20" y="70">Copilots, Huddles &amp; Cloud Workspaces</text>
    </g>

    <!-- Card 2: Open-Source Heavyweights -->
    <g transform="translate(255, 0)">
      <rect width="230" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text class="node-title" x="20" y="32">🌐 Top Open-Source Repos</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" x="20" y="54">Mattermost • Rocket.Chat • Zulip</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="20" y="70">Self-hosted, Docker &amp; K8s scalable</text>
    </g>

    <!-- Card 3: Modern Decentralized & E2EE -->
    <g transform="translate(510, 0)">
      <rect width="230" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text class="node-title" x="20" y="32">🛡️ Federated &amp; Sovereign</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" x="20" y="54">Element • Synapse • Conduit</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="20" y="70">Matrix protocol &amp; E2EE sovereignty</text>
    </g>

    <!-- Card 4: AI & ChatOps Frameworks -->
    <g transform="translate(765, 0)">
      <rect width="230" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text class="node-title" x="20" y="32">⚡ AI Runtimes &amp; ChatOps</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" x="20" y="54">Open WebUI • Atomic-Chat • Hubot</text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" x="20" y="70">LLM agents, Ollama &amp; automated bots</text>
    </g>
  </g>
</svg>
